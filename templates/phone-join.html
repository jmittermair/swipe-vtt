<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Swipe VTT - Connect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #fff;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    .status-text {
      font-size: 0.95rem;
      margin-bottom: 1rem;
      min-height: 1.4em;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin: 0 auto 1rem;
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #6b21a8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    .password-form { margin-top: 0.5rem; }

    .password-form label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.4rem;
      text-align: left;
    }

    .password-form input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      background: #0f1629;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .password-form input:focus { border-color: #6b21a8; }

    .user-info {
      font-size: 1rem;
      color: #ccc;
      margin-bottom: 1rem;
    }

    .user-info strong {
      color: #fff;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.5rem;
      margin-top: 1rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      color: #fff;
      background: #6b21a8;
    }

    .btn:hover { background: #581c87; }
    .btn:active { background: #4c1d6e; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-text {
      color: #c86a6a;
      font-size: 1rem;
      margin-top: 0.75rem;
      min-height: 1.2em;
    }

    .success-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../assets/carolingian-logo.png" alt="Swipe VTT" class="logo">
    <h1>Swipe VTT</h1>
    <p class="subtitle">Connect your phone</p>

    <div class="card">
      <!-- Connecting state -->
      <div id="state-connecting">
        <div class="spinner"></div>
        <p class="status-text">Connecting...</p>
      </div>

      <!-- Password required state -->
      <div id="state-password" class="hidden">
        <p class="user-info">User: <strong id="user-name"></strong></p>
        <form class="password-form" id="password-form">
          <label for="password-input">Enter your Foundry login pass</label>
          <input type="password" id="password-input" autocomplete="current-password" placeholder="Enter access key">
          <button type="submit" class="btn" id="submit-btn">Connect</button>
        </form>
        <p class="error-text" id="error-text"></p>
      </div>

      <!-- Success state -->
      <div id="state-success" class="hidden">
        <p class="status-text">Connected! Loading game...</p>
      </div>

      <!-- Error state (no user param, etc.) -->
      <div id="state-error" class="hidden">
        <p class="status-text" id="fatal-error-text">Something went wrong.</p>
        <button class="btn" onclick="window.location.href='../../../join'">Go to Login</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('user');
      const userName = params.get('name') || '';
      const joinUrl = '../../../join';

      const stateConnecting = document.getElementById('state-connecting');
      const statePassword = document.getElementById('state-password');
      const stateSuccess = document.getElementById('state-success');
      const stateError = document.getElementById('state-error');
      const passwordForm = document.getElementById('password-form');
      const passwordInput = document.getElementById('password-input');
      const submitBtn = document.getElementById('submit-btn');
      const errorText = document.getElementById('error-text');
      const fatalErrorText = document.getElementById('fatal-error-text');

      function showState(state) {
        [stateConnecting, statePassword, stateSuccess, stateError].forEach(
          el => el.classList.add('hidden')
        );
        state.classList.remove('hidden');
      }

      if (!userId) {
        fatalErrorText.textContent = 'Invalid link — no user specified.';
        showState(stateError);
        return;
      }

      async function tryJoin(password) {
        const body = new URLSearchParams({
          userid: userId,
          password: password || '',
          action: 'join'
        });

        const resp = await fetch(joinUrl, {
          method: 'POST',
          body: body,
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });

        try {
          return await resp.json();
        } catch {
          return { status: 'failed' };
        }
      }

      function shouldSkipAuth() {
        return params.get('noauth') === '1' || window.location.hostname.includes('sqyre.app');
      }

      async function autoJoin() {
        try {
          const result = await tryJoin('');

          if (result.status === 'success' || shouldSkipAuth()) {
            showState(stateSuccess);
            window.location.href = result.redirect || '../../../game';
            return;
          }

          document.getElementById('user-name').textContent = userName;
          showState(statePassword);
          passwordInput.focus();
        } catch (err) {
          fatalErrorText.textContent = 'Could not reach the server. Make sure you are on the same network.';
          showState(stateError);
        }
      }

      passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = passwordInput.value;
        errorText.textContent = '';
        submitBtn.disabled = true;

        try {
          const result = await tryJoin(pw);

          if (result.status === 'success') {
            showState(stateSuccess);
            window.location.href = result.redirect || '../../../game';
            return;
          }

          errorText.textContent = 'Incorrect access key. Please try again.';
          submitBtn.disabled = false;
          passwordInput.select();
        } catch (err) {
          errorText.textContent = 'Connection error. Please try again.';
          submitBtn.disabled = false;
        }
      });

      autoJoin();
    })();
  </script>
</body>
</html>
